<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Log in · StudySpot</title>
        <link rel="stylesheet" href="css/login.css">
    </head>
    <body>
        <nav class="navbar">
        <div class="nav-left">
            <span class="logo"><h2>StudySpot</h2></span>
        </nav>

        <main>
            <div class="login-card">
                <h1>Welcome!</h1>
                <p class="subtitle">Log in to find new Spots and leave reviews</p>

                <form id="login-form" novalidate>
                    <div class="field">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" autocomplete="username" required>

                    </div>
                     <div class="field">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="submit" id="submit-btn">Log in</button>
                    <div id="form-message" role="status" aria-live="polite"></div>
                </form>
                <p class="signup-hint">New here?<a href="Register.html"> Create an account</a></p>
            </div>
        </main>
        <script src="js/login.js"></script>
 
    </body>
</html>
<!---login html file -->
