<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Place · StudySpot Admin</title>
    <link rel="stylesheet" href="css/edit_places.css">
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-left">
        <span class="logo"><h2>StudySpot</h2></span>
      </div>
    </nav>

    <main>
      <div class="login-card">
        <h1>Edit place</h1>
        <p class="subtitle">Update this study spot's details, then save your changes.</p>

        <form id="edit-place-form" novalidate>
          <div class="field">
            <label for="place_name">Place name</label>
            <input type="text" id="place_name" name="place_name" required>
          </div>

          <div class="field">
            <label for="place_type">Place type</label>
            <input type="text" id="place_type" name="place_type" placeholder="e.g. cafe, library" required>
          </div>

          <div class="field">
            <label for="address">Address</label>
            <input type="text" id="address" name="address" autocomplete="street-address" required>
          </div>

          <div class="field">
            <label for="city">City</label>
            <input type="text" id="city" name="city" autocomplete="address-level2" required>
          </div>

          <div class="field">
            <label for="state">State</label>
            <input type="text" id="state" name="state" autocomplete="address-level1" required>
          </div>

          <div class="form-actions">
            <button type="submit" class="submit" id="submit-btn">Save changes</button>
            <button type="button" class="cancel" id="cancel-btn">Cancel</button>
          </div>

          <div id="form-message" role="status" aria-live="polite"></div>
        </form>
      </div>
    </main>

    <script src="js/auth.js"></script>
    <script>
      const API_BASE = "http://localhost:5001";
      const DASHBOARD_PAGE = "admin_places.html";

      const params = new URLSearchParams(window.location.search);
      const placeId = params.get("id");

      const form = document.getElementById("edit-place-form");
      const submitBtn = document.getElementById("submit-btn");
      const cancelBtn = document.getElementById("cancel-btn");
      const messageEl = document.getElementById("form-message");

      const nameInput = document.getElementById("place_name");
      const typeInput = document.getElementById("place_type");
      const addressInput = document.getElementById("address");
      const cityInput = document.getElementById("city");
      const stateInput = document.getElementById("state");

      function setMessage(text, isError = false) {
        messageEl.textContent = text;
        messageEl.classList.toggle("error", isError);
      }

      function populateForm(place) {
        nameInput.value = place.place_name || "";
        typeInput.value = place.place_type || "";
        addressInput.value = place.address || "";
        cityInput.value = place.city || "";
        stateInput.value = place.state || "";
      }

      cancelBtn.addEventListener("click", () => {
        window.location.href = DASHBOARD_PAGE;
      });

      (async () => {
        // Page-level gate: redirects non-admins away before anything else runs.
        const pageUser = await requireAdminPage(DASHBOARD_PAGE);
        if (!pageUser) return;

        if (!placeId) {
          setMessage("No place was specified to edit.", true);
          form.querySelectorAll("input, button[type=submit]").forEach(el => el.disabled = true);
          return;
        }

        // No single-place GET endpoint exists, so try the record the
        // dashboard cached on click, falling back to the full /places list.
        const cached = sessionStorage.getItem(`editPlace:${placeId}`);
        if (cached) {
          try {
            populateForm(JSON.parse(cached));
            return;
          } catch (err) {
            console.error("Cached place parse error:", err);
          }
        }

        try {
          const res = await fetch(`${API_BASE}/places`);
          if (!res.ok) throw new Error("fetch-failed");
          const places = await res.json();
          const place = Array.isArray(places)
            ? places.find(p => String(p.place_id) === String(placeId))
            : null;

          if (!place) throw new Error("not-found");
          populateForm(place);
        } catch (err) {
          console.error("Load place error:", err);
          if (err.message === "not-found") {
            setMessage("Place not found.", true);
          } else {
            setMessage("Could not load this place. Try again later.", true);
          }
          form.querySelectorAll("input, button[type=submit]").forEach(el => el.disabled = true);
        }
      })();

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        setMessage("");

        const currentUser = await requireAdminAction();
        if (!currentUser) return;

        const payload = {
          place_name: nameInput.value.trim(),
          place_type: typeInput.value.trim(),
          address: addressInput.value.trim(),
          city: cityInput.value.trim(),
          state: stateInput.value.trim(),
          user_id: currentUser.user_id
        };

        submitBtn.disabled = true;
        submitBtn.textContent = "Saving…";

        try {
          const res = await fetch(`${API_BASE}/admin/places/${encodeURIComponent(placeId)}`, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              "X-User-Role": currentUser.user_role
            },
            body: JSON.stringify(payload)
          });

          if (!res.ok) throw new Error("Failed to update place");

          sessionStorage.removeItem(`editPlace:${placeId}`);
          window.location.href = DASHBOARD_PAGE;
        } catch (err) {
          console.error("Update place error:", err);
          setMessage("Could not save changes. Try again later.", true);
          submitBtn.disabled = false;
          submitBtn.textContent = "Save changes";
        }
      });
    </script>
  </body>
</html>
