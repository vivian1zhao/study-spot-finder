services:

  db:
    image: mysql:8.4

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: StudySpots
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql
      - ./studyspot_schema.sql:/docker-entrypoint-initdb.d/studyspot_schema.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  backend:
    build:
      context: ./backend

    restart: unless-stopped

    environment:
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: StudySpots

    depends_on:
      db:
        condition: service_healthy


  frontend:
    build:
      context: ./Frontend

    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend


volumes:
  mysql_data: